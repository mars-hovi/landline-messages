<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #c22029;
  }
  body {
    position: relative;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Wordmark stays pinned near the top, always fully visible. */
  .wordmark-wrap {
    position: absolute;
    top: 5vh;
    left: 50%;
    transform: translateX(-50%);
    line-height: 0;
    z-index: 5;
  }
  .wordmark-wrap img {
    display: block;
    width: min(1200px, 90vw);
    height: auto;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.2));
  }

  /* Phone always fully covers the viewport — true full-bleed, cropped as
     needed so no background ever shows behind it, at any screen size. */
  .phone-wrap {
    position: fixed;
    inset: 0;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .phone-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Fixed to the viewport (not the bleeding image) so it always stays on
     screen, pinned near the top edge of the pedestal. The offset scales
     with the same width formula as the phone image so it tracks the same
     spot on the photo at any screen size. */
  /* Positioned from an exact design reference at 1728x1117 (x:673, y:264,
     381px wide) and expressed as percentages of that frame so it lands in
     the same relative spot at any screen size. */
  .caption {
    position: fixed;
    left: 50%;
    top: 23.64%;
    transform: translateX(-50%);
    width: min(381px, 85vw);
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35), 0 1px 10px rgba(0,0,0,0.2);
    text-align: center;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 400;
    font-size: 20px;
    line-height: 1.4;
    margin: 0;
    pointer-events: none;
    z-index: 5;
  }

  /* --- Tooltip that follows the cursor while idle --- */
  .cursor-tip {
    position: fixed;
    top: 0;
    left: 0;
    transform: translate(0, 0);
    background: #fff;
    color: #2b2620;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    pointer-events: none;
    white-space: nowrap;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .cursor-tip.show { opacity: 1; }

  /* --- Anchored bubble once recording flow has started ---
     Fixed to the viewport, positioned just above .caption so the two never
     collide, regardless of screen size. */
  .anchor-box {
    position: fixed;
    left: 50%;
    top: 15%;
    transform: translateX(-50%) translateY(-6px) scale(0.96);
    background: #fff;
    color: #2b2620;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    padding: 10px 14px;
    font-size: 0.78rem;
    font-weight: 600;
    max-width: 210px;
    text-align: center;
    line-height: 1.35;
    opacity: 0;
    transition: opacity 0.15s ease, transform 0.15s ease;
    pointer-events: none;
    z-index: 20;
  }
  .anchor-box.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }

  .anchor-box.error { color: #a5271c; }

  /* --- Preview player --- */
  .player-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 8px;
  }
  .play-btn {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: #d4572c;
    color: #fff;
    font-size: 0.7rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }
  .scrub {
    flex: 1;
    min-width: 0;
    width: 0;
    accent-color: #d4572c;
    cursor: pointer;
    pointer-events: auto;
  }
  .time-label {
    flex: none;
    font-size: 0.62rem;
    color: #8a8070;
    font-weight: 500;
    min-width: 30px;
    text-align: right;
  }
  .preview-actions {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .preview-actions button {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    pointer-events: auto;
    font-family: inherit;
  }
  #discardBtn { color: #8a8070; }
  #sendBtn { color: #d4572c; }
  #discardBtn:hover, #sendBtn:hover { text-decoration: underline; }

  @media (max-width: 380px) {
    .anchor-box { max-width: 180px; font-size: 0.72rem; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="wordmark-wrap">
      <img src="leave-a-message.png" alt="leave a message...">
    </div>

    <div class="phone-wrap" id="phoneWrap">
      <img class="phone-img" id="phoneImg" src="phone.jpg" alt="a red rotary phone on a pedestal">
    </div>
  </div>

  <p class="caption">record a lil voice mail for my alarm to play at the start each day!</p>
  <div class="anchor-box" id="anchorBox"></div>

  <div class="cursor-tip" id="cursorTip">click to start recording</div>
  <audio id="previewAudio" style="display:none"></audio>

<script>
(function () {
  const SUPABASE_URL = "https://gwnvhgilayzjzkimvmcr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_NgslFznczZJ3TP4W9K3C_A_521vw2GP";
  const BUCKET = "messages";
  const IMG_IDLE = "phone.jpg";
  const IMG_ACTIVE = "phone.jpg";

  const phoneWrap = document.getElementById("phoneWrap");
  const phoneImg = document.getElementById("phoneImg");
  const cursorTip = document.getElementById("cursorTip");
  const anchorBox = document.getElementById("anchorBox");
  const previewAudio = document.getElementById("previewAudio");

  const canHover = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  let state = "idle"; // idle | countdown | recording | preview | sending | sent | error
  let mediaRecorder = null;
  let chunks = [];
  let mimeType = "";
  let stream = null;
  let recordedBlob = null;
  let countdownTimer = null;
  let revertTimer = null;

  // ---------- cursor-following tooltip (idle, hover-capable devices) ----------
  if (canHover) {
    phoneWrap.addEventListener("mouseenter", () => {
      if (state === "idle") cursorTip.classList.add("show");
    });
    phoneWrap.addEventListener("mousemove", (e) => {
      if (state !== "idle") return;
      cursorTip.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 14}px)`;
    });
    phoneWrap.addEventListener("mouseleave", () => {
      cursorTip.classList.remove("show");
    });
  }

  function hideCursorTip() {
    cursorTip.classList.remove("show");
  }

  function showAnchor(html, isError) {
    anchorBox.innerHTML = html;
    anchorBox.classList.toggle("error", !!isError);
    anchorBox.classList.add("show");
  }
  function hideAnchor() {
    anchorBox.classList.remove("show");
    anchorBox.innerHTML = "";
  }

  function pickMimeType() {
    const candidates = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
    for (const c of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return "";
  }
  function extFromMime(type) {
    if (type.includes("mp4")) return "m4a";
    if (type.includes("ogg")) return "ogg";
    return "webm";
  }
  function fmtTime(sec) {
    if (!isFinite(sec)) sec = 0;
    const m = Math.floor(sec / 60).toString().padStart(2, "0");
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return m + ":" + s;
  }

  function goIdle() {
    clearTimeout(revertTimer);
    state = "idle";
    phoneImg.src = IMG_IDLE;
    hideAnchor();
    recordedBlob = null;
    previewAudio.pause();
    previewAudio.removeAttribute("src");
  }

  function startFlow() {
    if (state !== "idle") return;
    hideCursorTip();
    phoneImg.src = IMG_ACTIVE;
    state = "countdown";

    // Ask for mic access right away so it's (hopefully) resolved by the time the countdown ends.
    const permPromise = navigator.mediaDevices.getUserMedia({ audio: true });

    let n = 3;
    showAnchor(`recording in ${n}`);
    countdownTimer = setInterval(() => {
      n -= 1;
      if (n > 0) {
        showAnchor(`recording in ${n}`);
        return;
      }
      clearInterval(countdownTimer);
      permPromise.then(beginRecording).catch(onMicError);
    }, 900);
  }

  function onMicError() {
    clearInterval(countdownTimer);
    showAnchor("couldn't access your mic — check permissions and try again", true);
    revertTimer = setTimeout(goIdle, 3200);
    state = "error";
  }

  function beginRecording(mediaStream) {
    if (state !== "countdown") {
      // user backed out or something else changed state while we waited on permission
      mediaStream.getTracks().forEach((t) => t.stop());
      return;
    }
    stream = mediaStream;
    mimeType = pickMimeType();
    try {
      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    } catch (err) {
      stream.getTracks().forEach((t) => t.stop());
      showAnchor("recording isn't supported in this browser", true);
      revertTimer = setTimeout(goIdle, 3200);
      state = "error";
      return;
    }

    chunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      recordedBlob = new Blob(chunks, { type: mediaRecorder.mimeType || mimeType || "audio/webm" });
      enterPreview();
    };

    mediaRecorder.start();
    state = "recording";
    showAnchor("recording in progress.<br>click to hang up");
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
  }

  function enterPreview() {
    state = "preview";
    const url = URL.createObjectURL(recordedBlob);
    previewAudio.src = url;

    anchorBox.innerHTML = `
      <div class="player-row">
        <button class="play-btn" id="playBtn" aria-label="play">&#9654;</button>
        <input class="scrub" id="scrub" type="range" min="0" max="100" value="0">
        <span class="time-label" id="timeLabel">0:00</span>
      </div>
      <div class="preview-actions">
        <button id="discardBtn">discard</button>
        <button id="sendBtn">send it</button>
      </div>
    `;
    anchorBox.classList.remove("error");
    anchorBox.classList.add("show");

    const playBtn = document.getElementById("playBtn");
    const scrub = document.getElementById("scrub");
    const timeLabel = document.getElementById("timeLabel");

    playBtn.onclick = (e) => {
      e.stopPropagation();
      if (previewAudio.paused) { previewAudio.play(); playBtn.innerHTML = "&#10073;&#10073;"; }
      else { previewAudio.pause(); playBtn.innerHTML = "&#9654;"; }
    };
    previewAudio.ontimeupdate = () => {
      if (previewAudio.duration) scrub.value = (previewAudio.currentTime / previewAudio.duration) * 100;
      timeLabel.textContent = fmtTime(previewAudio.currentTime);
    };
    previewAudio.onended = () => { playBtn.innerHTML = "&#9654;"; };
    scrub.oninput = (e) => {
      e.stopPropagation();
      if (previewAudio.duration) previewAudio.currentTime = (scrub.value / 100) * previewAudio.duration;
    };
    scrub.onclick = (e) => e.stopPropagation();

    document.getElementById("discardBtn").onclick = (e) => { e.stopPropagation(); goIdle(); };
    document.getElementById("sendBtn").onclick = (e) => { e.stopPropagation(); sendRecording(); };
  }

  async function sendRecording() {
    if (!recordedBlob) return;
    state = "sending";
    showAnchor("sending...");

    const ext = extFromMime(recordedBlob.type || "");
    const filename = "msg-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;

    try {
      const res = await fetch(SUPABASE_URL + "/storage/v1/object/" + BUCKET + "/" + filename, {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type": recordedBlob.type || "application/octet-stream",
        },
        body: recordedBlob,
      });
      if (!res.ok) throw new Error("upload failed: " + res.status);

      state = "sent";
      showAnchor("sent! thanks 🥰");
      revertTimer = setTimeout(goIdle, 2000);
    } catch (err) {
      showAnchor("something went wrong — try again?", true);
      revertTimer = setTimeout(() => { if (recordedBlob) enterPreview(); else goIdle(); }, 2400);
    }
  }

  phoneWrap.addEventListener("click", () => {
    if (state === "idle") { startFlow(); return; }
    if (state === "recording") { stopRecording(); return; }
    // countdown / preview / sending / sent / error: clicks on the phone itself do nothing extra
  });

  goIdle();
})();
</script>
</body>
</html>
